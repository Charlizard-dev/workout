<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A5C"/>
      <stop offset="0.55" stop-color="#FF4D2E"/>
      <stop offset="1" stop-color="#E03A1B"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232630"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Ember glow bar -->
  <rect x="96" y="392" width="320" height="14" rx="7" fill="url(#ember)" opacity="0.9"/>

  <!-- Dumbbell -->
  <g fill="#F5F6FA">
    <rect x="104" y="243" width="304" height="26" rx="13"/>
    <rect x="132" y="192" width="40" height="128" rx="16"/>
    <rect x="182" y="210" width="30" height="92" rx="13"/>
    <rect x="340" y="192" width="40" height="128" rx="16"/>
    <rect x="300" y="210" width="30" height="92" rx="13"/>
  </g>

  <!-- Bolt (energy) -->
  <polygon points="272,150 204,272 244,272 232,362 308,232 264,232" fill="url(#ember)"/>
</svg>
